<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapeepat Dev · เกียรติบัตรและกิจกรรม</title>
  <meta name="description" content="เกียรติบัตร ใบรับรอง และกิจกรรมของ Rapeepat Dev">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05060a;
      --text: #f4f6fb;
      --muted: rgba(244, 246, 251, 0.62);
      --faint: rgba(244, 246, 251, 0.38);
      --glass: rgba(255, 255, 255, 0.06);
      --glass-hover: rgba(255, 255, 255, 0.10);
      --edge: rgba(255, 255, 255, 0.16);
      --shine: rgba(255, 255, 255, 0.35);
      --gold: #ffd166;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Noto Sans Thai", system-ui, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body.lock { overflow: hidden; }
    a { color: inherit; }

    /* ---------- พื้นหลัง ---------- */
    #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; }
    .blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; filter: blur(70px); opacity: .85; }
    .blob { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: float 22s ease-in-out infinite; }
    .b1 { width: 460px; height: 460px; background: #ff9f3b; top: -120px; left: -100px; opacity: .6; }
    .b2 { width: 380px; height: 380px; background: #b13bff; bottom: -120px; right: -80px; animation-delay: -6s; }
    .b3 { width: 300px; height: 300px; background: #3b5bff; top: 45%; left: 55%; animation-delay: -12s; opacity: .7; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(60px, 40px) scale(1.1); }
      66%      { transform: translate(-40px, 70px) scale(.92); }
    }
    body.webgl .blobs { display: none; }
    .grain {
      position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .06;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* ---------- Liquid glass ---------- */
    .glass {
      position: relative;
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--edge);
      box-shadow:
        inset 0 1px 0 var(--shine),
        inset 0 -1px 0 rgba(255,255,255,.05),
        inset 0 0 24px rgba(255,255,255,.04),
        0 20px 50px rgba(0,0,0,.45);
    }
    .glass::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      background: linear-gradient(160deg, rgba(255,255,255,.2) 0%, rgba(255,255,255,.04) 35%, transparent 60%);
      pointer-events: none;
    }

    .wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 16px; }

    /* ---------- แถบเมนู ---------- */
    .nav {
      position: sticky; top: 16px; z-index: 10;
      margin: 16px auto 0;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 10px 10px 16px;
      border-radius: 999px;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; flex: none; }
    .brand img { width: 32px; height: 32px; border-radius: 50%; background: #1a1d29; }
    .nav-links { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-links a {
      text-decoration: none; font-size: .9rem; font-weight: 500; white-space: nowrap;
      padding: 8px 12px; border-radius: 999px; color: var(--muted);
      transition: background .2s, color .2s;
    }
    .nav-links a:hover { color: var(--text); background: rgba(255,255,255,.08); }
    .nav-links a.active { color: var(--text); background: rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }

    /* ---------- หัวเรื่อง ---------- */
    .hero { padding: 64px 0 28px; text-align: center; animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow {
      display: inline-block; font-size: .8rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
      padding: 6px 14px; border-radius: 999px; color: var(--muted); margin-bottom: 18px;
    }
    .hero h1 {
      font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.2;
      background: linear-gradient(120deg, #fff 15%, #ffe2a8 50%, #e2b6ff 85%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero p { color: var(--muted); max-width: 460px; margin: 12px auto 0; line-height: 1.6; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }

    /* ---------- ตัวเลขสรุป ---------- */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 560px; margin: 0 auto 8px; }
    .stat { border-radius: 22px; padding: 18px 12px; text-align: center; }
    .stat b { display: block; font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; }
    .stat span { font-size: .8rem; color: var(--muted); }

    /* ---------- หัวข้อ section ---------- */
    .section-title {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
      margin: 64px 0 20px;
    }
    .section-title h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font: inherit; font-size: .84rem; font-weight: 500; color: var(--muted);
      padding: 7px 14px; border-radius: 999px; cursor: pointer;
      transition: color .2s, background .2s;
    }
    .chip:hover { color: var(--text); }
    .chip.active { color: var(--text); background: rgba(255,255,255,.16); }

    /* ---------- เกียรติบัตร ---------- */
    .certs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: 18px;
    }
    .cert {
      border-radius: 24px; padding: 10px;
      cursor: pointer; text-align: left; font: inherit; color: inherit;
      display: flex; flex-direction: column;
      transition: transform .3s cubic-bezier(.2,.8,.2,1), background .3s, box-shadow .3s;
      animation: rise .6s cubic-bezier(.2,.8,.2,1) both;
    }
    .cert:hover, .cert:focus-visible {
      transform: translateY(-4px); background: var(--glass-hover); outline: none;
      box-shadow: inset 0 1px 0 var(--shine), 0 26px 60px rgba(0,0,0,.55);
    }
    .cert .thumb {
      aspect-ratio: 1.414 / 1; /* สัดส่วนกระดาษ A4 แนวนอน */
      border-radius: 16px; overflow: hidden; position: relative;
      border: 1px solid rgba(255,255,255,.1);
      background: linear-gradient(135deg, #ffd16633, #b13bff33);
      display: grid; place-items: center;
    }
    .cert .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }
    .cert:hover .thumb img { transform: scale(1.04); }
    .cert .thumb .ph { font-size: 2.8rem; }
    .badge {
      position: absolute; top: 10px; left: 10px;
      font-size: .72rem; font-weight: 600;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(10,12,20,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.18);
    }
    .badge.award { color: var(--gold); border-color: rgba(255,209,102,.45); }
    .cert .body { padding: 14px 8px 6px; }
    .cert h3 { font-size: 1rem; font-weight: 600; line-height: 1.4; }
    .cert .issuer { font-size: .85rem; color: var(--muted); margin-top: 4px; }
    .cert .date { font-size: .76rem; color: var(--faint); margin-top: 6px; }

    /* ---------- กิจกรรม: timeline ---------- */
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before {
      content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px;
      background: linear-gradient(to bottom, rgba(255,209,102,.6), rgba(177,59,255,.5), rgba(59,91,255,.15));
      border-radius: 2px;
    }
    .act { position: relative; margin-bottom: 18px; animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
    .act::before {
      content: ""; position: absolute; left: -26px; top: 22px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #0b0d16; border: 2px solid var(--gold);
      box-shadow: 0 0 12px rgba(255,209,102,.6);
    }
    .act-card { border-radius: 22px; padding: 18px 20px; }
    .act-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .act h3 { font-size: 1.05rem; font-weight: 600; line-height: 1.4; }
    .act .when { font-size: .78rem; color: var(--faint); white-space: nowrap; margin-top: 3px; }
    .act .role { font-size: .85rem; color: var(--gold); margin-top: 4px; }
    .act p { color: var(--muted); font-size: .92rem; line-height: 1.6; margin-top: 8px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag {
      font-size: .74rem; font-weight: 500; color: var(--muted);
      padding: 4px 10px; border-radius: 999px;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
    }
    .gallery {
      display: grid; gap: 8px; margin-top: 14px;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 112px), 1fr));
    }
    .gallery button {
      position: relative; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.14); padding: 0; cursor: zoom-in; background: rgba(255,255,255,.05);
      transition: transform .2s;
    }
    .gallery button:hover { transform: scale(1.04); }
    .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* ช่องสุดท้าย "+12" */
    .gallery .more-tile::after {
      content: attr(data-more);
      position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 1.3rem; font-weight: 700; color: #fff;
      background: rgba(5,6,10,.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .gallery-note { font-size: .8rem; color: var(--faint); margin-top: 10px; }
    .skeleton { aspect-ratio: 4 / 3; border-radius: 12px; background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.1), rgba(255,255,255,.04)); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    /* โฟลเดอร์แบบฝัง (กรณีไม่มี API key) */
    .folder-embed {
      margin-top: 14px; border-radius: 14px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.14); background: #fff;
    }
    .folder-embed iframe { width: 100%; height: 340px; border: 0; display: block; }
    .act .more {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
      font-size: .84rem; font-weight: 500; text-decoration: none; color: var(--muted);
    }
    .act .more:hover { color: var(--text); }

    .empty { text-align: center; color: var(--faint); padding: 32px 0; grid-column: 1 / -1; }

    /* ---------- Lightbox ---------- */
    .lb {
      position: fixed; inset: 0; z-index: 50;
      display: grid; place-items: center; padding: 20px 16px;
      background: rgba(3,4,8,.72);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .lb.open { opacity: 1; pointer-events: auto; }
    .lb-box {
      width: 100%; max-width: 860px; max-height: calc(100vh - 40px); overflow: auto;
      border-radius: 28px; padding: 12px;
      transform: scale(.96); transition: transform .3s cubic-bezier(.2,.8,.2,1);
    }
    .lb.open .lb-box { transform: none; }
    .lb-img { width: 100%; border-radius: 18px; display: block; background: #111; max-height: 70vh; object-fit: contain; }
    .lb-info { padding: 16px 10px 8px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
    .lb-info h3 { font-size: 1.1rem; font-weight: 600; }
    .lb-info p { color: var(--muted); font-size: .88rem; margin-top: 4px; }
    .lb-close, .lb-nav {
      position: absolute; z-index: 2;
      width: 44px; height: 44px; border-radius: 50%;
      color: var(--text); font-size: 1.2rem; cursor: pointer;
      display: grid; place-items: center;
    }
    .lb-close { top: 20px; right: 20px; }
    .lb-nav { top: 50%; transform: translateY(-50%); font-size: 1.4rem; }
    .lb-prev { left: 16px; }
    .lb-next { right: 16px; }
    .lb-nav[hidden] { display: none; }
    .lb-count { font-size: .8rem; color: var(--faint); white-space: nowrap; }
    @media (max-width: 600px) {
      .lb-nav { top: auto; bottom: 24px; transform: none; }
    }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      text-decoration: none; font-size: .86rem; font-weight: 500; white-space: nowrap;
      padding: 10px 16px; border-radius: 14px;
      background: rgba(255,209,102,.18); border: 1px solid rgba(255,209,102,.4);
      transition: background .2s;
    }
    .btn:hover { background: rgba(255,209,102,.3); }

    footer { text-align: center; color: var(--faint); font-size: .78rem; padding: 48px 0 40px; }

    @media (max-width: 600px) {
      .brand span { display: none; }
      .nav-links a { padding: 8px 10px; font-size: .84rem; }
      .stat b { font-size: 1.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
    }
  </style>
</head>

  <div class="wrap">

  <script>
    // =====================================================
    // 🔧 เกียรติบัตร
    //   image  : ลิงก์แชร์รูปจาก Google Drive (ตั้งเป็น "ทุกคนที่มีลิงก์")
    //            หรือชื่อไฟล์ใน repo เช่น "certs/cert1.jpg" (ไม่มีใส่ "")
    //   award  : true = เป็นรางวัล (ขึ้นป้ายสีทอง + นับในช่อง "รางวัล")
    //   level  : ข้อความบนป้าย เช่น "ชนะเลิศ", "รองชนะเลิศอันดับ 1" (ไม่มีใส่ "")

    // =====================================================

      {

        image: "https://drive.google.com/file/d/1VovAen2LEz3mSV_cZXVJpCul0YjBG6xL/view?usp=sharing",
        verify: ""
      },
      {
        title: "PLC ระดับ 1 (30 ชั่วโมง)",
        issuer: "กรมพัฒนาฝีมือแรงงาน กระทรวงแรงงาน",
        date: "3 ส.ค. 2569",
        category: "อบรม",
        award: false,
        level: "",
        image: "https://drive.google.com/file/d/1PrcakAd6Ud5eaSTKfqlse0UD9yrbH-cj/view?usp=sharing",

      },
      {

        issuer: "สถาบันนวัตกรรมไทย-ฝรั่งเศส มจพ.",
        date: "26 มิ.ย. 2569",

    // =====================================================
    // 🔧 กิจกรรม (เรียงตามวันที่ใหม่สุดขึ้นก่อนให้อัตโนมัติ)
    //   images : ใส่ลิงก์รูปกี่รูปก็ได้ ["ลิงก์1", "ลิงก์2", "ลิงก์3", ...] (ไม่มีใส่ [])

    //            ใช้ images กับ folder พร้อมกันได้
    //   link   : ลิงก์โพสต์ / ข่าว / repo ที่เกี่ยวข้อง (ไม่มีใส่ "")
    // =====================================================
    const ACTIVITIES = [
      {
        title: "ชื่อกิจกรรม (ตัวอย่าง: ดึงรูปทั้งโฟลเดอร์)",
        role: "บทบาท เช่น ผู้เข้าแข่งขัน / หัวหน้าทีม / วิทยากร",
        date: "2026-08-20",

        tags: ["โดรน", "Python"],

        folder: "", // เช่น "https://drive.google.com/drive/folders/xxxxxxxx?usp=sharing"

      },
      {
        title: "ชื่อกิจกรรม (ตัวอย่าง: ใส่รูปทีละรูป)",

        tags: ["จิตอาสา"],
        images: [
          // "https://drive.google.com/file/d/xxxxxxxx/view?usp=sharing",
          // "https://drive.google.com/file/d/yyyyyyyy/view?usp=sharing",
        ],

        link: ""
      }
    ];

    // 🔑 Google Drive API key (ไม่บังคับ)
    //   ใส่แล้ว → รูปจากโฟลเดอร์จะขึ้นเป็นแกลเลอรีสวย ๆ ในธีมเว็บ กดดูเต็มจอ เลื่อนดูทีละรูปได้
    //   ไม่ใส่   → แสดงโฟลเดอร์แบบฝังของ Google (พื้นขาว) แทน
    const DRIVE_API_KEY = "";

    const GALLERY_LIMIT = 8; // จำนวนรูปที่โชว์ในการ์ด ที่เหลือขึ้นเป็น "+N" (กดดูได้ครบทุกรูป)
    // =====================================================

    document.getElementById("y").textContent = new Date().getFullYear();

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const thDate = d => d ? new Date(d).toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" }) : "";

    // ลิงก์แชร์ Google Drive → ลิงก์รูปที่แสดงในเว็บได้
    function img(url, size = 1600) {
      if (!url) return "";
      const id = (url.match(/\/d\/([\w-]+)/) || url.match(/[?&]id=([\w-]+)/) || [])[1];
      return id && url.includes("google.com") ? `https://drive.google.com/thumbnail?id=${id}&sz=w${size}` : url;
    }

    // ---------- ตัวเลขสรุป (นับขึ้นแบบมีแอนิเมชัน) ----------
    function countUp(el, n) {
      const start = performance.now();
      (function step(t) {
        const k = Math.min((t - start) / 900, 1);
        el.textContent = Math.round(n * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step);
      })(start);
    }
    countUp(document.getElementById("sCert"), CERTIFICATES.length);
    countUp(document.getElementById("sAward"), CERTIFICATES.filter(c => c.award).length);
    countUp(document.getElementById("sAct"), ACTIVITIES.length);

    // ---------- เกียรติบัตร ----------
    const certsEl = document.getElementById("certs");
    const filtersEl = document.getElementById("certFilters");
    const sortedCerts = [...CERTIFICATES].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    const cats = ["ทั้งหมด", ...new Set(sortedCerts.map(c => c.category).filter(Boolean))];

    filtersEl.innerHTML = cats.map((c, i) =>
      `<button class="chip glass${i === 0 ? " active" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
    filtersEl.addEventListener("click", e => {
      const b = e.target.closest(".chip");
      if (!b) return;
      filtersEl.querySelectorAll(".chip").forEach(x => x.classList.toggle("active", x === b));
      renderCerts(b.dataset.cat);
    });

    function renderCerts(cat) {
      const list = cat === "ทั้งหมด" ? sortedCerts : sortedCerts.filter(c => c.category === cat);
      if (!list.length) { certsEl.innerHTML = `<p class="empty">ยังไม่มีเกียรติบัตร</p>`; return; }
      certsEl.innerHTML = list.map((c, i) => `
        <button class="cert glass" data-i="${sortedCerts.indexOf(c)}" style="animation-delay:${i * 60}ms">
          <div class="thumb">
            ${c.image ? `<img src="${esc(img(c.image, 800))}" alt="${esc(c.title)}" loading="lazy">` : `<span class="ph">${c.award ? "🏆" : "📜"}</span>`}
            ${c.level ? `<span class="badge${c.award ? " award" : ""}">${c.award ? "🏆 " : ""}${esc(c.level)}</span>` : ""}
          </div>
          <div class="body">
            <h3>${esc(c.title)}</h3>
            <p class="issuer">${esc(c.issuer)}</p>
            <p class="date">${thDate(c.date)}${c.category ? " · " + esc(c.category) : ""}</p>
          </div>
        </button>`).join("");
    }
    renderCerts("ทั้งหมด");

    certsEl.addEventListener("click", e => {
      const b = e.target.closest(".cert");
      if (!b) return;
      const c = sortedCerts[+b.dataset.i];
      if (!c.image) { if (c.verify) window.open(c.verify, "_blank", "noopener"); return; }
      openLB([img(c.image)], 0, `
        <div><h3>${esc(c.title)}</h3><p>${esc(c.issuer)} · ${thDate(c.date)}</p></div>
        ${c.verify ? `<a class="btn" href="${esc(c.verify)}" target="_blank" rel="noopener">ตรวจสอบใบรับรอง ↗</a>` : ""}`);
    });

    // ---------- กิจกรรม ----------
    const tlEl = document.getElementById("timeline");
    const sortedActs = [...ACTIVITIES].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    const actPhotos = sortedActs.map(() => []); // รูปทั้งหมดของแต่ละกิจกรรม (ใช้ตอนกดดูเต็มจอ)

    const folderId = url => ((url || "").match(/\/folders\/([\w-]+)/) || (url || "").match(/[?&]id=([\w-]+)/) || [])[1];

    // ดึงรายชื่อรูปทั้งหมดในโฟลเดอร์ Drive (รวมหลายหน้า)
    async function listFolderImages(id) {
      const out = [];
      let pageToken = "";
      do {
        const q = encodeURIComponent(`'${id}' in parents and mimeType contains 'image/' and trashed = false`);
        const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=name&pageSize=200&fields=nextPageToken,files(id)&key=${DRIVE_API_KEY}${pageToken ? "&pageToken=" + pageToken : ""}`);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        data.files.forEach(f => out.push(`https://drive.google.com/thumbnail?id=${f.id}&sz=w1600`));
        pageToken = data.nextPageToken || "";
      } while (pageToken);
      return out;
    }

    function galleryHTML(i, photos) {
      if (!photos.length) return "";
      const shown = photos.slice(0, GALLERY_LIMIT);
      const extra = photos.length - shown.length;
      return `<div class="gallery">${shown.map((src, j) => {
        const isLast = extra > 0 && j === shown.length - 1;
        return `<button data-a="${i}" data-j="${j}" aria-label="ดูรูปที่ ${j + 1}"${isLast ? ` class="more-tile" data-more="+${extra + 1}"` : ""}>
          <img src="${esc(src.replace(/sz=w\d+/, "sz=w400"))}" alt="" loading="lazy"></button>`;
      }).join("")}</div>
      ${photos.length > 1 ? `<p class="gallery-note">${photos.length} รูป · กดเพื่อดูเต็มจอ</p>` : ""}`;
    }

    async function loadGallery(a, i) {
      const box = document.getElementById(`g${i}`);
      const photos = (a.images || []).filter(Boolean).map(src => img(src));
      const fid = folderId(a.folder);

      if (fid && DRIVE_API_KEY) {
        box.innerHTML = `<div class="gallery">${'<div class="skeleton"></div>'.repeat(4)}</div>`;
        try { photos.push(...await listFolderImages(fid)); }
        catch (e) { console.warn("โหลดโฟลเดอร์ไม่ได้", e); }
      }

      actPhotos[i] = photos;
      let html = galleryHTML(i, photos);

      // ไม่มี API key (หรือโหลดไม่ได้) → ฝังโฟลเดอร์ของ Google แทน
      if (fid && (!DRIVE_API_KEY || photos.length === (a.images || []).filter(Boolean).length)) {
        html += `<div class="folder-embed"><iframe src="https://drive.google.com/embeddedfolderview?id=${fid}#grid" loading="lazy" title="รูปกิจกรรม"></iframe></div>`;
      }
      if (fid) {
        html += `<a class="more" href="https://drive.google.com/drive/folders/${fid}" target="_blank" rel="noopener">📁 เปิดโฟลเดอร์รูปทั้งหมด ↗</a>`;
      }
      box.innerHTML = html;
    }

    tlEl.innerHTML = sortedActs.length ? sortedActs.map((a, i) => `
      <article class="act" style="animation-delay:${i * 80}ms">
        <div class="act-card glass">
          <div class="act-head">
            <div>
              <h3>${esc(a.title)}</h3>
              ${a.role ? `<p class="role">${esc(a.role)}</p>` : ""}
            </div>
            <span class="when">${thDate(a.date)}${a.place ? " · " + esc(a.place) : ""}</span>
          </div>
          ${a.desc ? `<p>${esc(a.desc)}</p>` : ""}
          ${a.tags && a.tags.length ? `<div class="tags">${a.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
          <div id="g${i}"></div>
          ${a.link ? `<a class="more" href="${esc(a.link)}" target="_blank" rel="noopener">ดูรายละเอียด ↗</a>` : ""}
        </div>
      </article>`).join("") : `<p class="empty">ยังไม่มีกิจกรรม</p>`;
    sortedActs.forEach(loadGallery);

    tlEl.addEventListener("click", e => {
      const b = e.target.closest(".gallery button");
      if (!b) return;
      const i = +b.dataset.a;
      const a = sortedActs[i];
      openLB(actPhotos[i], +b.dataset.j, `<div><h3>${esc(a.title)}</h3><p>${thDate(a.date)}${a.place ? " · " + esc(a.place) : ""}</p></div>`);
    });

    // ---------- Lightbox (เลื่อนดูทีละรูปได้) ----------
    const lb = document.getElementById("lb");
    const lbImg = document.getElementById("lbImg");
    const lbInfo = document.getElementById("lbInfo");
    const lbPrev = document.getElementById("lbPrev");
    const lbNext = document.getElementById("lbNext");
    let lbList = [], lbIndex = 0, lbBaseInfo = "";

    function showLB() {
      lbImg.src = lbList[lbIndex];
      const multi = lbList.length > 1;
      lbPrev.hidden = lbNext.hidden = !multi;
      lbInfo.innerHTML = lbBaseInfo + (multi ? `<span class="lb-count">${lbIndex + 1} / ${lbList.length}</span>` : "");
      // โหลดรูปถัดไปรอไว้
      if (multi) new Image().src = lbList[(lbIndex + 1) % lbList.length];
    }
    function openLB(list, index, info) {
      lbList = list; lbIndex = index; lbBaseInfo = info;
      showLB();
      lb.classList.add("open");
      document.body.classList.add("lock");
      document.getElementById("lbClose").focus();
    }
    function stepLB(d) {
      if (lbList.length < 2) return;
      lbIndex = (lbIndex + d + lbList.length) % lbList.length;
      showLB();
    }
    function closeLB() {
      lb.classList.remove("open");
      document.body.classList.remove("lock");
    }
    document.getElementById("lbClose").addEventListener("click", closeLB);
    lbPrev.addEventListener("click", () => stepLB(-1));
    lbNext.addEventListener("click", () => stepLB(1));
    lb.addEventListener("click", e => { if (e.target === lb) closeLB(); });
    document.addEventListener("keydown", e => {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") closeLB();
      if (e.key === "ArrowLeft") stepLB(-1);
      if (e.key === "ArrowRight") stepLB(1);
    });
    // ปัดซ้าย/ขวาบนมือถือ
    let touchX = null;
    lb.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener("touchend", e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 50) stepLB(dx < 0 ? 1 : -1);
      touchX = null;
    });
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ---------- Three.js: พื้นหลังของเหลวไหล ขยับตามเมาส์ ----------
    (function () {
      if (!window.THREE) return;
      const canvas = document.getElementById("bg");
      let renderer;
      try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false }); } catch (e) { return; }

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const uniforms = {
        uTime:   { value: 0 },
        uRes:    { value: new THREE.Vector2() },
        uMouse:  { value: new THREE.Vector2(0.5, 0.5) },
        uScroll: { value: 0 }
      };

      const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv;
          uniform float uTime, uScroll;
          uniform vec2 uRes, uMouse;
          float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
          float noise(vec2 p){
            vec2 i = floor(p), f = fract(p), u = f*f*(3.0-2.0*f);
            return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
          }
          float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.02; a*=0.5; } return v; }
          void main(){
            vec2 asp = vec2(uRes.x/uRes.y, 1.0);
            vec2 p = (vUv-0.5)*asp*2.2 + vec2(0.0, uScroll*0.6);
            vec2 m = (uMouse-0.5)*asp*2.2 + vec2(0.0, uScroll*0.6);
            float t = uTime*0.08;
            float md = length(p-m);
            p += (m-p)*0.18*exp(-md*1.5);
            vec2 q = vec2(fbm(p+t), fbm(p+vec2(5.2,1.3)-t));
            vec2 r = vec2(fbm(p+3.0*q+vec2(1.7,9.2)+t*1.4), fbm(p+3.0*q+vec2(8.3,2.8)-t*1.2));
            float f = fbm(p+3.0*r);
            // โทนทอง-ม่วง ให้เข้ากับหน้ารางวัล
            vec3 col = mix(vec3(0.55,0.25,1.0), vec3(1.0,0.62,0.23), clamp(f*1.6-0.2,0.0,1.0));
            col = mix(col, vec3(0.23,0.36,1.0), clamp(length(q)*0.9-0.3,0.0,1.0));
            col = mix(col, vec3(1.0,0.82,0.40), clamp(r.x*r.x*1.4-0.3,0.0,1.0));
            col *= smoothstep(0.35,0.95,f)*0.8;
            col += 0.05*exp(-md*2.5)*vec3(1.0,0.9,0.7);
            col *= smoothstep(1.25,0.25,length(vUv-0.5)*1.6);
            col += vec3(0.02,0.02,0.035);
            gl_FragColor = vec4(col, 1.0);
          }`
      });
      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        uniforms.uRes.value.set(window.innerWidth, window.innerHeight);
      }
      resize();
      window.addEventListener("resize", resize);

      const target = new THREE.Vector2(0.5, 0.5);
      const setPointer = (x, y) => target.set(x / innerWidth, 1 - y / innerHeight);
      window.addEventListener("pointermove", e => setPointer(e.clientX, e.clientY));
      window.addEventListener("touchmove", e => { const t = e.touches[0]; if (t) setPointer(t.clientX, t.clientY); }, { passive: true });

      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const clock = new THREE.Clock();
      let scroll = 0;
      (function loop() {
        uniforms.uTime.value = reduce ? 10 : clock.getElapsedTime();
        uniforms.uMouse.value.lerp(target, 0.05);
        scroll += (scrollY / innerHeight - scroll) * 0.08;
        uniforms.uScroll.value = scroll;
        renderer.render(scene, camera);
        if (!reduce) requestAnimationFrame(loop);
      })();
      document.body.classList.add("webgl");
    })();
  </script>
</body>
</html>
