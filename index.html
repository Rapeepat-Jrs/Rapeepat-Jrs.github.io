<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapeepat Dev · Contact</title>
  <meta name="description" content="ช่องทางติดต่อ Rapeepat Dev">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05060a;
      --text: #f4f6fb;
      --muted: rgba(244, 246, 251, 0.62);
      --glass: rgba(255, 255, 255, 0.06);
      --glass-hover: rgba(255, 255, 255, 0.11);
      --edge: rgba(255, 255, 255, 0.16);
      --shine: rgba(255, 255, 255, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Noto Sans Thai", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 48px 16px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- พื้นหลังลูกแก้วสีเคลื่อนไหว (สำรอง) ---------- */
    .blobs {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      filter: blur(70px);
      opacity: 0.85;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      animation: float 22s ease-in-out infinite;
    }
    .b1 { width: 460px; height: 460px; background: #3b5bff; top: -120px; left: -100px; }
    .b2 { width: 380px; height: 380px; background: #b13bff; bottom: -120px; right: -80px; animation-delay: -6s; }
    .b3 { width: 300px; height: 300px; background: #00d4c8; top: 45%; left: 55%; animation-delay: -12s; opacity: .7; }
    .b4 { width: 240px; height: 240px; background: #ff3b8d; top: 60%; left: -60px; animation-delay: -17s; opacity: .55; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(60px, 40px) scale(1.1); }
      66%      { transform: translate(-40px, 70px) scale(0.92); }
    }

    /* canvas ของ Three.js */
    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      display: block;
    }
    body.webgl .blobs { display: none; }

    /* noise เล็กน้อยให้ดูเป็นกระจกจริง */
    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.06;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* ---------- Liquid glass ---------- */
    .glass {
      position: relative;
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--edge);
      box-shadow:
        inset 0 1px 0 var(--shine),
        inset 0 -1px 0 rgba(255, 255, 255, 0.05),
        inset 0 0 24px rgba(255, 255, 255, 0.04),
        0 20px 50px rgba(0, 0, 0, 0.45);
    }
    /* แสงสะท้อนโค้งด้านบน */
    .glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(160deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.04) 35%, transparent 60%);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 420px;
      border-radius: 32px;
      padding: 36px 24px 28px;
      text-align: center;
      animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(.98); }
      to   { opacity: 1; transform: none; }
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 16px;
      padding: 3px;
      background: linear-gradient(135deg, rgba(255,255,255,.7), rgba(255,255,255,.1));
      box-shadow: 0 8px 30px rgba(80, 100, 255, 0.35);
    }
    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #1a1d29;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .handle {
      font-size: .9rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .bio {
      font-size: .95rem;
      color: var(--muted);
      line-height: 1.6;
      margin: 14px auto 26px;
      max-width: 300px;
    }

    /* ---------- ปุ่มลิงก์ ---------- */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-radius: 20px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      font-size: .98rem;
      transition: transform .25s cubic-bezier(.2,.8,.2,1), background .25s, box-shadow .25s;
      overflow: hidden;
    }
    .link:hover, .link:focus-visible {
      background: var(--glass-hover);
      transform: translateY(-2px) scale(1.015);
      box-shadow:
        inset 0 1px 0 var(--shine),
        0 14px 36px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255,255,255,0.08);
      outline: none;
    }
    .link:active { transform: scale(.98); }

    .link .icon {
      flex: none;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .link .icon svg { width: 20px; height: 20px; fill: currentColor; }
    .link .label { flex: 1; text-align: left; }
    .link .arrow {
      opacity: .45;
      transition: transform .25s, opacity .25s;
    }
    .link:hover .arrow { transform: translateX(3px); opacity: .9; }

    /* สีไอคอนแต่ละแบรนด์ */
    .github    .icon { color: #ffffff; }
    .facebook  .icon { color: #4b8bff; }
    .instagram .icon { color: #ff5fa2; }
    .line      .icon { color: #2fd16b; }
    .email     .icon { color: #ffd166; }

    footer {
      margin-top: 26px;
      font-size: .78rem;
      color: rgba(244,246,251,.38);
    }

    @media (prefers-reduced-motion: reduce) {
      .blob, .card { animation: none; }
      .link { transition: none; }
    }
  </style>
</head>

  <canvas id="bg" aria-hidden="true"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    document.getElementById("y").textContent = new Date().getFullYear();

    // ---------- Three.js: พื้นหลังของเหลวไหล ขยับตามเมาส์ ----------
    (function () {
      if (!window.THREE) return; // โหลดไม่ได้ → ใช้พื้นหลัง CSS แทน
      const canvas = document.getElementById("bg");
      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
      } catch (e) { return; }

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      const uniforms = {
        uTime:  { value: 0 },
        uRes:   { value: new THREE.Vector2() },
        uMouse: { value: new THREE.Vector2(0.5, 0.5) }
      };

      const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: `
          varying vec2 vUv;
          void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
        `,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv;
          uniform float uTime;
          uniform vec2 uRes;
          uniform vec2 uMouse;

          vec3 hash3(vec2 p) {
            vec3 q = vec3(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)), dot(p, vec2(419.2, 371.9)));
            return fract(sin(q) * 43758.5453);
          }
          float noise(vec2 p) {
            vec2 i = floor(p), f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            float a = hash3(i).x, b = hash3(i + vec2(1, 0)).x;
            float c = hash3(i + vec2(0, 1)).x, d = hash3(i + vec2(1, 1)).x;
            return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
          }
          float fbm(vec2 p) {
            float v = 0.0, a = 0.5;
            for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.02; a *= 0.5; }
            return v;
          }

          void main() {
            vec2 uv = vUv;
            vec2 p = (uv - 0.5) * vec2(uRes.x / uRes.y, 1.0) * 2.2;
            vec2 m = (uMouse - 0.5) * vec2(uRes.x / uRes.y, 1.0) * 2.2;
            float t = uTime * 0.08;

            // ดึงของเหลวเข้าหาเมาส์เล็กน้อย
            float md = length(p - m);
            p += (m - p) * 0.18 * exp(-md * 1.5);

            // domain warping = ลายของเหลว
            vec2 q = vec2(fbm(p + t), fbm(p + vec2(5.2, 1.3) - t));
            vec2 r = vec2(fbm(p + 3.0 * q + vec2(1.7, 9.2) + t * 1.4),
                          fbm(p + 3.0 * q + vec2(8.3, 2.8) - t * 1.2));
            float f = fbm(p + 3.0 * r);

            vec3 blue   = vec3(0.23, 0.36, 1.00);
            vec3 purple = vec3(0.69, 0.23, 1.00);
            vec3 teal   = vec3(0.00, 0.83, 0.78);
            vec3 pink   = vec3(1.00, 0.23, 0.55);

            vec3 col = mix(blue, purple, clamp(f * 1.6, 0.0, 1.0));
            col = mix(col, teal, clamp(length(q) * 0.9 - 0.3, 0.0, 1.0));
            col = mix(col, pink, clamp(r.x * r.x * 1.4 - 0.25, 0.0, 1.0));

            // ทำให้มืด เหลือแต่แสงเป็นสาย ๆ
            float glow = smoothstep(0.35, 0.95, f);
            col *= glow * 0.95;
            col += 0.06 * exp(-md * 2.5) * vec3(0.7, 0.8, 1.0);

            // vignette
            float v = smoothstep(1.25, 0.25, length(uv - 0.5) * 1.6);
            col *= v;
            col += vec3(0.02, 0.023, 0.04);

            gl_FragColor = vec4(col, 1.0);
          }
        `
      });

      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

      function resize() {
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h, false);
        uniforms.uRes.value.set(w, h);
      }
      resize();
      window.addEventListener("resize", resize);

      const target = new THREE.Vector2(0.5, 0.5);
      function setPointer(x, y) {
        target.set(x / window.innerWidth, 1 - y / window.innerHeight);
      }
      window.addEventListener("pointermove", e => setPointer(e.clientX, e.clientY));
      window.addEventListener("touchmove", e => {
        const t = e.touches[0]; if (t) setPointer(t.clientX, t.clientY);
      }, { passive: true });

      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const clock = new THREE.Clock();
      function loop() {
        uniforms.uTime.value = reduce ? 10 : clock.getElapsedTime();
        uniforms.uMouse.value.lerp(target, 0.05);
        renderer.render(scene, camera);
        if (!reduce) requestAnimationFrame(loop);
      }
      loop();

      document.body.classList.add("webgl"); // ซ่อนพื้นหลัง CSS
    })();
  </script>
