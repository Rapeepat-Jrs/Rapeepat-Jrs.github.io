<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapeepat Dev · ผลงาน</title>
  <meta name="description" content="รวมผลงานของ Rapeepat Dev">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05060a;
      --text: #f4f6fb;
      --muted: rgba(244, 246, 251, 0.62);
      --faint: rgba(244, 246, 251, 0.38);
      --glass: rgba(255, 255, 255, 0.06);
      --glass-hover: rgba(255, 255, 255, 0.10);
      --edge: rgba(255, 255, 255, 0.16);
      --shine: rgba(255, 255, 255, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Noto Sans Thai", system-ui, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    /* ---------- พื้นหลัง ---------- */
    #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; }
    .blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; filter: blur(70px); opacity: .85; }
    .blob { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: float 22s ease-in-out infinite; }
    .b1 { width: 460px; height: 460px; background: #3b5bff; top: -120px; left: -100px; }
    .b2 { width: 380px; height: 380px; background: #b13bff; bottom: -120px; right: -80px; animation-delay: -6s; }
    .b3 { width: 300px; height: 300px; background: #00d4c8; top: 45%; left: 55%; animation-delay: -12s; opacity: .7; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(60px, 40px) scale(1.1); }
      66%      { transform: translate(-40px, 70px) scale(.92); }
    }
    body.webgl .blobs { display: none; }
    .grain {
      position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .06;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* ---------- Liquid glass ---------- */
    .glass {
      position: relative;
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--edge);
      box-shadow:
        inset 0 1px 0 var(--shine),
        inset 0 -1px 0 rgba(255,255,255,.05),
        inset 0 0 24px rgba(255,255,255,.04),
        0 20px 50px rgba(0,0,0,.45);
    }
    .glass::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      background: linear-gradient(160deg, rgba(255,255,255,.2) 0%, rgba(255,255,255,.04) 35%, transparent 60%);
      pointer-events: none;
    }

    .wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 16px; }

    /* ---------- แถบเมนู ---------- */
    .nav {
      position: sticky; top: 16px; z-index: 10;
      margin: 16px auto 0;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 10px 10px 16px;
      border-radius: 999px;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; }
    .brand img { width: 32px; height: 32px; border-radius: 50%; background: #1a1d29; }
    .nav-links { display: flex; gap: 2px; }
    .nav-links a {
      text-decoration: none; font-size: .9rem; font-weight: 500;
      padding: 8px 12px; border-radius: 999px; color: var(--muted);
      transition: background .2s, color .2s;
    }
    .nav-links a:hover { color: var(--text); background: rgba(255,255,255,.08); }
    .nav-links a.active { color: var(--text); background: rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }

    /* ---------- หัวเรื่อง ---------- */
    .hero { padding: 72px 0 36px; text-align: center; animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow {
      display: inline-block; font-size: .8rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
      padding: 6px 14px; border-radius: 999px; color: var(--muted); margin-bottom: 18px;
    }
    .hero h1 {
      font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1;
      background: linear-gradient(120deg, #fff 20%, #b9c4ff 55%, #e2b6ff 85%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero p { color: var(--muted); max-width: 460px; margin: 14px auto 0; line-height: 1.6; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: none; }
    }

    /* ---------- ตัวกรอง ---------- */
    .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 28px; }
    .chip {
      font: inherit; font-size: .88rem; font-weight: 500; color: var(--muted);
      padding: 8px 16px; border-radius: 999px; cursor: pointer;
      transition: color .2s, background .2s, transform .2s;
    }
    .chip:hover { color: var(--text); transform: translateY(-1px); }
    .chip.active { color: var(--text); background: rgba(255,255,255,.16); }

    /* ---------- การ์ดผลงาน ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 310px), 1fr));
      gap: 18px;
    }
    .project {
      border-radius: 26px;
      padding: 10px;
      display: flex; flex-direction: column;
      text-decoration: none;
      transition: transform .3s cubic-bezier(.2,.8,.2,1), background .3s, box-shadow .3s;
      animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
    }
    .project:hover {
      transform: translateY(-4px);
      background: var(--glass-hover);
      box-shadow: inset 0 1px 0 var(--shine), 0 26px 60px rgba(0,0,0,.55);
    }
    .thumb {
      aspect-ratio: 16 / 10;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,.1);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }
    .project:hover .thumb img { transform: scale(1.04); }
    .thumb .ph {
      width: 100%; height: 100%;
      display: grid; place-items: center;
      font-size: 2.6rem;
    }
    .body { padding: 16px 10px 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .body h3 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; }
    .body p { color: var(--muted); font-size: .92rem; line-height: 1.55; flex: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .tag {
      font-size: .74rem; font-weight: 500; color: var(--muted);
      padding: 4px 10px; border-radius: 999px;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
    }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn {
      flex: 1; text-align: center; text-decoration: none;
      font-size: .86rem; font-weight: 500;
      padding: 9px 12px; border-radius: 14px;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
      transition: background .2s;
    }
    .btn:hover { background: rgba(255,255,255,.16); }
    .btn.primary { background: rgba(120,140,255,.28); border-color: rgba(160,175,255,.4); }
    .btn.primary:hover { background: rgba(120,140,255,.42); }

    /* ---------- GitHub repos ---------- */
    .section-title {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      margin: 72px 0 18px;
    }
    .section-title h2 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
    .section-title a { font-size: .88rem; color: var(--muted); text-decoration: none; }
    .section-title a:hover { color: var(--text); }

    .repos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr));
      gap: 14px;
    }
    .repo {
      border-radius: 20px; padding: 18px;
      text-decoration: none;
      display: flex; flex-direction: column; gap: 8px;
      transition: transform .25s, background .25s;
    }
    .repo:hover { transform: translateY(-3px); background: var(--glass-hover); }
    .repo h4 { font-size: .98rem; font-weight: 600; word-break: break-word; }
    .repo p { color: var(--muted); font-size: .85rem; line-height: 1.5; flex: 1; }
    .meta { display: flex; gap: 14px; font-size: .78rem; color: var(--faint); }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .note { color: var(--faint); font-size: .9rem; text-align: center; grid-column: 1 / -1; padding: 24px; }

    /* ---------- ท้ายหน้า ---------- */
    .cta {
      margin: 80px auto 0; max-width: 560px;
      border-radius: 30px; padding: 32px 24px; text-align: center;
    }
    .cta h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    .cta p { color: var(--muted); margin: 8px 0 20px; }
    .cta .btn { display: inline-block; flex: none; padding: 12px 26px; font-size: .95rem; }
    footer { text-align: center; color: var(--faint); font-size: .78rem; padding: 36px 0 40px; }

    @media (max-width: 520px) {
      .brand span { display: none; }
      .hero { padding-top: 52px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="blobs" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="wrap">
    <nav class="nav glass">
      <a class="brand" href="index.html">
        <img src="https://github.com/Rapeepat-Jrs.png" alt="">
        <span>Rapeepat Dev</span>
      </a>
      <div class="nav-links">
        <a href="portfolio.html" class="active">ผลงาน</a>
        <a href="downloads.html">ดาวน์โหลด</a>
        <a href="index.html">ติดต่อ</a>
      </div>
    </nav>

    <header class="hero">
      <span class="eyebrow glass">Portfolio</span>
      <h1>ผลงานที่ผมสร้าง</h1>
      <p>รวมโปรเจกต์ที่ทำมา ทั้งเว็บ แอป และงานทดลองเล็ก ๆ น้อย ๆ</p>
    </header>

    <div class="filters" id="filters"></div>
    <section class="grid" id="projects"></section>

    <div class="section-title">
      <h2>Repositories ล่าสุด</h2>
      <a href="https://github.com/Rapeepat-Jrs?tab=repositories" target="_blank" rel="noopener">ดูทั้งหมดบน GitHub →</a>
    </div>
    <section class="repos" id="repos"><p class="note">กำลังโหลด…</p></section>

    <section class="cta glass">
      <h2>อยากร่วมงานกัน?</h2>
      <p>ทักมาพูดคุยได้เลยครับ</p>
      <a class="btn primary" href="index.html">ช่องทางติดต่อ →</a>
    </section>

    <footer>© <span id="y"></span> Rapeepat Dev</footer>
  </div>

  <script>
    // =====================================================
    // 🔧 แก้ผลงานของคุณตรงนี้
    //   image : ลิงก์รูป หรือชื่อไฟล์ใน repo เช่น "images/shop.png" (ไม่มีก็ใส่ "")
    //   emoji : ใช้แทนรูป ถ้าไม่มี image
    //   demo  : ลิงก์ดูเว็บจริง  /  code : ลิงก์ซอร์สโค้ด (ไม่มีใส่ "")
    // =====================================================
    const PROJECTS = [
      {
        title: "Contact Link Page",
        desc: "หน้ารวมช่องทางติดต่อ ธีมมืด สไตล์ liquid glass พื้นหลังของเหลวด้วย Three.js",
        category: "Web",
        tags: ["HTML", "CSS", "Three.js"],
        image: "",
        emoji: "🔗",
        demo: "index.html",
        code: "https://github.com/Rapeepat-Jrs/Rapeepat-Jrs.github.io"
      },
      {
        title: "ชื่อโปรเจกต์ที่ 2",
        desc: "อธิบายสั้น ๆ ว่าโปรเจกต์นี้ทำอะไร ใช้แก้ปัญหาอะไร",
        category: "App",
        tags: ["React Native", "Firebase"],
        image: "",
        emoji: "📱",
        demo: "",
        code: ""
      },
      {
        title: "ชื่อโปรเจกต์ที่ 3",
        desc: "อธิบายสั้น ๆ ว่าโปรเจกต์นี้ทำอะไร ใช้แก้ปัญหาอะไร",
        category: "Design",
        tags: ["Figma", "UI/UX"],
        image: "",
        emoji: "🎨",
        demo: "",
        code: ""
      }
    ];

    const GITHUB_USER = "Rapeepat-Jrs";
    // =====================================================

    document.getElementById("y").textContent = new Date().getFullYear();

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const gradients = [
      "linear-gradient(135deg,#3b5bff55,#b13bff55)",
      "linear-gradient(135deg,#00d4c855,#3b5bff55)",
      "linear-gradient(135deg,#ff3b8d55,#b13bff55)"
    ];

    // ---------- ตัวกรอง + การ์ด ----------
    const cats = ["ทั้งหมด", ...new Set(PROJECTS.map(p => p.category))];
    const filtersEl = document.getElementById("filters");
    const gridEl = document.getElementById("projects");

    function renderProjects(cat) {
      const list = cat === "ทั้งหมด" ? PROJECTS : PROJECTS.filter(p => p.category === cat);
      gridEl.innerHTML = list.map((p, i) => `
        <article class="project glass" style="animation-delay:${i * 70}ms">
          <div class="thumb">
            ${p.image
              ? `<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">`
              : `<div class="ph" style="background:${gradients[i % gradients.length]}">${esc(p.emoji || "✨")}</div>`}
          </div>
          <div class="body">
            <h3>${esc(p.title)}</h3>
            <p>${esc(p.desc)}</p>
            <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
            ${(p.demo || p.code) ? `<div class="actions">
              ${p.demo ? `<a class="btn primary" href="${esc(p.demo)}" target="_blank" rel="noopener">ดูผลงาน</a>` : ""}
              ${p.code ? `<a class="btn" href="${esc(p.code)}" target="_blank" rel="noopener">โค้ด</a>` : ""}
            </div>` : ""}
          </div>
        </article>`).join("");
    }

    filtersEl.innerHTML = cats.map((c, i) =>
      `<button class="chip glass${i === 0 ? " active" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
    filtersEl.addEventListener("click", e => {
      const b = e.target.closest(".chip");
      if (!b) return;
      filtersEl.querySelectorAll(".chip").forEach(x => x.classList.toggle("active", x === b));
      renderProjects(b.dataset.cat);
    });
    renderProjects("ทั้งหมด");

    // ---------- ดึง repo จาก GitHub อัตโนมัติ ----------
    const langColors = { JavaScript: "#f1e05a", TypeScript: "#3178c6", HTML: "#e34c26", CSS: "#663399", Python: "#3572A5", Java: "#b07219", Swift: "#F05138", Kotlin: "#A97BFF", Dart: "#00B4AB", "C++": "#f34b7d", C: "#555555", PHP: "#4F5D95", Go: "#00ADD8", Vue: "#41b883" };
    const reposEl = document.getElementById("repos");

    fetch(`https://api.github.com/users/${GITHUB_USER}/repos?sort=updated&per_page=12`)
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(repos => {
        repos = repos.filter(r => !r.fork).slice(0, 6);
        if (!repos.length) { reposEl.innerHTML = `<p class="note">ยังไม่มี repository สาธารณะ</p>`; return; }
        reposEl.innerHTML = repos.map(r => `
          <a class="repo glass" href="${esc(r.html_url)}" target="_blank" rel="noopener">
            <h4>${esc(r.name)}</h4>
            <p>${esc(r.description || "ไม่มีคำอธิบาย")}</p>
            <div class="meta">
              ${r.language ? `<span><span class="dot" style="background:${langColors[r.language] || "#8b949e"}"></span>${esc(r.language)}</span>` : ""}
              <span>★ ${r.stargazers_count}</span>
              <span>${new Date(r.updated_at).toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" })}</span>
            </div>
          </a>`).join("");
      })
      .catch(() => { reposEl.innerHTML = `<p class="note">โหลด repository ไม่ได้ ลองรีเฟรชอีกครั้ง</p>`; });
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ---------- Three.js: พื้นหลังของเหลวไหล ขยับตามเมาส์ ----------
    (function () {
      if (!window.THREE) return;
      const canvas = document.getElementById("bg");
      let renderer;
      try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false }); } catch (e) { return; }

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const uniforms = {
        uTime:   { value: 0 },
        uRes:    { value: new THREE.Vector2() },
        uMouse:  { value: new THREE.Vector2(0.5, 0.5) },
        uScroll: { value: 0 }
      };

      const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv;
          uniform float uTime, uScroll;
          uniform vec2 uRes, uMouse;
          float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
          float noise(vec2 p){
            vec2 i = floor(p), f = fract(p), u = f*f*(3.0-2.0*f);
            return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
          }
          float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.02; a*=0.5; } return v; }
          void main(){
            vec2 asp = vec2(uRes.x/uRes.y, 1.0);
            vec2 p = (vUv-0.5)*asp*2.2 + vec2(0.0, uScroll*0.6);
            vec2 m = (uMouse-0.5)*asp*2.2 + vec2(0.0, uScroll*0.6);
            float t = uTime*0.08;
            float md = length(p-m);
            p += (m-p)*0.18*exp(-md*1.5);
            vec2 q = vec2(fbm(p+t), fbm(p+vec2(5.2,1.3)-t));
            vec2 r = vec2(fbm(p+3.0*q+vec2(1.7,9.2)+t*1.4), fbm(p+3.0*q+vec2(8.3,2.8)-t*1.2));
            float f = fbm(p+3.0*r);
            vec3 col = mix(vec3(0.23,0.36,1.0), vec3(0.69,0.23,1.0), clamp(f*1.6,0.0,1.0));
            col = mix(col, vec3(0.0,0.83,0.78), clamp(length(q)*0.9-0.3,0.0,1.0));
            col = mix(col, vec3(1.0,0.23,0.55), clamp(r.x*r.x*1.4-0.25,0.0,1.0));
            col *= smoothstep(0.35,0.95,f)*0.85;
            col += 0.05*exp(-md*2.5)*vec3(0.7,0.8,1.0);
            col *= smoothstep(1.25,0.25,length(vUv-0.5)*1.6);
            col += vec3(0.02,0.023,0.04);
            gl_FragColor = vec4(col, 1.0);
          }`
      });
      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        uniforms.uRes.value.set(window.innerWidth, window.innerHeight);
      }
      resize();
      window.addEventListener("resize", resize);

      const target = new THREE.Vector2(0.5, 0.5);
      const setPointer = (x, y) => target.set(x / innerWidth, 1 - y / innerHeight);
      window.addEventListener("pointermove", e => setPointer(e.clientX, e.clientY));
      window.addEventListener("touchmove", e => { const t = e.touches[0]; if (t) setPointer(t.clientX, t.clientY); }, { passive: true });

      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const clock = new THREE.Clock();
      let scroll = 0;
      (function loop() {
        uniforms.uTime.value = reduce ? 10 : clock.getElapsedTime();
        uniforms.uMouse.value.lerp(target, 0.05);
        scroll += (scrollY / innerHeight - scroll) * 0.08; // ของเหลวไหลตามการเลื่อนหน้า
        uniforms.uScroll.value = scroll;
        renderer.render(scene, camera);
        if (!reduce) requestAnimationFrame(loop);
      })();
      document.body.classList.add("webgl");
    })();
  </script>
</body>
</html>
